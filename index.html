<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola desde Python</title>
    <!-- Estilos sencillos: centrado y tarjeta con sombra -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }
        .tarjeta {
            background: #fff;
            padding: 2.5rem 3.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 { color: #4f46e5; margin: 0; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Hola desde Python</h1>
    </div>
</body>
</html>
